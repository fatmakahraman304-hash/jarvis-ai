name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release metadata and Python syntax
        shell: pwsh
        run: |
          $release = Get-Content version.json | ConvertFrom-Json
          if ($release.version -ne "4.6.33") { throw "Unexpected version: $($release.version)" }
          python -m compileall -q run.py core
          if (Test-Path "tests/test_smoke.py") { throw "Legacy updater runs test_smoke.py before updating; keep the long smoke test named test_ci_smoke.py." }
          if (-not (Test-Path "tests/test_ci_smoke.py")) { throw "CI smoke test is missing." }
      - name: Install JARVIS runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run fast regression tests
        shell: pwsh
        run: |
          $tests = @(
            "tests/test_fast_conversation.py",
            "tests/test_model_tiers.py",
            "tests/test_models.py",
            "tests/test_windows_transport.py",
            "tests/test_research_budget.py",
            "tests/test_live_voice.py"
            "tests/test_spaceplanner.py"
          )
          foreach ($test in $tests) {
            python $test
            if ($LASTEXITCODE -ne 0) { throw "$test failed with exit code $LASTEXITCODE" }
          }
      - name: Run end-to-end smoke test
        run: python tests/test_ci_smoke.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging\dist | Out-Null
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $candidates = @(
            (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "ISCC.exe not found. Checked: $($candidates -join '; ')" }
          & $compiler "packaging\windows.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (-not (Test-Path "packaging\dist\JARVIS-Setup-4.6.33.exe")) { throw "Installer EXE was not created." }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Setup-v4.6.33
          path: packaging/dist/JARVIS-Setup-4.6.33.exe
          if-no-files-found: error
          retention-days: 30
