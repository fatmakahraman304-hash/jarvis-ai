name: Build Windows installer

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release metadata and Python syntax
        shell: pwsh
        run: |
          $release = Get-Content version.json | ConvertFrom-Json
          if ($release.version -ne "4.6.30") { throw "Unexpected version: $($release.version)" }
          python -m compileall -q run.py core
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging\dist | Out-Null
          $programFilesX86 = [Environment]::GetFolderPath([Environment+SpecialFolder]::ProgramFilesX86)
          $candidates = @(
            (Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe")
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) { throw "ISCC.exe not found. Checked: $($candidates -join '; ')" }
          & $compiler "packaging\windows.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (-not (Test-Path "packaging\dist\JARVIS-Setup-4.6.30.exe")) { throw "Installer EXE was not created." }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Setup-v4.6.30
          path: packaging/dist/JARVIS-Setup-4.6.30.exe
          if-no-files-found: error
          retention-days: 30
