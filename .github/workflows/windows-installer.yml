name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release metadata and Python syntax
        shell: pwsh
        run: |
          $v = Get-Content version.json | ConvertFrom-Json
          if ($v.version -ne "4.6.29") { throw "Unexpected version: $($v.version)" }
          python -m compileall -q core run.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging\dist | Out-Null
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" packaging\windows.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Setup-v4.6.29
          path: packaging/dist/JARVIS-Setup-4.6.29.exe
          if-no-files-found: error
          retention-days: 30
