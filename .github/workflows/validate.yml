name: JARVIS validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check web/lab.js
      - name: Validate release metadata
        run: node -e "const v=require('./version.json'); if(!/^\\d+\\.\\d+\\.\\d+$/.test(v.version)) process.exit(1); console.log('JARVIS version:',v.version)"
