name: JARVIS validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check web/lab.js
          node --check web/app.js
          node --check web/worlds.js
          node --check web/preferences.js
          node --check web/stt.js
          node --check web/architecture.js
          node tests/test_continuous_listening.js
          node tests/test_architecture_bridge.js
      - name: Check Python syntax
        run: python -m compileall -q run.py core scripts
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt playwright
      - name: Check expansion features
        run: python tests/test_expansion.py
      - name: Check desktop control
        run: python tests/test_desktop_control.py
      - name: Check native tool execution
        run: python tests/test_tool_execution.py
      - name: Check Gemini tool schemas
        run: python tests/test_gemini_tool_schema.py
      - name: Check Gemini tool declaration budget
        run: python tests/test_gemini_tool_budget.py
      - name: Check Gemini Lite wire compatibility
        run: python tests/test_gemini_lite_wire.py
      - name: Check Gemini quota and 400 recovery
        run: python tests/test_gemini_quota_recovery.py
      - name: Check visual verification pause
        run: python tests/test_visual_pause.py
      - name: Check observe-act loop
        run: python tests/test_observe_loop.py
      - name: Check routine browser approvals
        run: python tests/test_browser_approval.py
      - name: Check durable assistant and device verification
        run: |
          python tests/test_assistant.py
          python tests/test_home_verification.py
          python tests/test_gemini_continuation.py
          python tests/test_update_recovery.py
          node tests/test_update_ui.js
      - name: Check native architecture and semantic desktop
        run: |
          python tests/test_architecture.py
          python tests/test_desktop_semantic.py
      - name: Install test browser
        run: python -m playwright install --with-deps chromium
      - name: Check real 2D and 3D architecture editor
        env:
          JARVIS_CI_HEADED: "1"
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python tests/test_architecture_browser.py
      - name: Preserve editor test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-test-evidence
          path: test-results/
      - name: Check overlay recovery in browser
        run: python tests/test_browser_observe.py
      - name: Verify isolated camera and AR modes
        run: python tests/test_camera_mode_isolation.py
      - name: Validate release metadata
        run: node -e "const v=require('./version.json'); if(!/^\\d+\\.\\d+\\.\\d+$/.test(v.version)) process.exit(1); console.log('JARVIS version:',v.version)"
